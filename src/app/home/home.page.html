<ion-header [translucent]="true">
  <ion-toolbar  color="success">
    <ion-title>
     ProyectoIonic
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>


  <ion-item>
    <ion-label position="stacked">Este es un item. Agregar nueva tarea</ion-label>
    <ion-input [(ngModel)]="newTaskStr" placeholder="Escribe tu tarea"></ion-input>
 </ion-item>

 
<ion-button color="light" expand="block" (click)="addTask()">Agregar tarea</ion-button>

<ion-list>
  @for(task of task; track task.id){
    <ion-item>
      <ion-label>{{task.titulo}}</ion-label>
    </ion-item>}
</ion-list>

</ion-content>
